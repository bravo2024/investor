name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Tests (artifacts, frozen models, notebook, README, Streamlit pages)
        run: python -m pytest -q

  streamlit-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install app runtime only
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: App imports and every page renders
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          pages = ["Overview", "Models & ensembles", "Segments", "Contact budget", "Drivers", "Customer lookup"]
          at = AppTest.from_file("app.py", default_timeout=300).run()
          assert not at.exception, at.exception
          for page in pages:
              at.sidebar.radio[0].set_value(page).run()
              assert not at.exception, [e.value for e in at.exception]
          print("all pages rendered:", len(pages))
          PY
