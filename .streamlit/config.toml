# Theme matches the palette used by the figures in artifacts/figures.
[theme]
base = "light"
primaryColor = "#4C72B0"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F9"
textColor = "#1F2933"

[server]
headless = true

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
